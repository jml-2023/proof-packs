<style>
.payment-failed-banner {
  display: flex;
  align-items: flex-start;
  background: var(--ds-status-warning-bg);
  color: var(--ds-status-warning-ink);
  border: 1px solid var(--ds-border-strong);
  border-radius: var(--ds-radius-md);
  padding: var(--ds-space-4);
  gap: var(--ds-space-4);
  font-family: inherit;
  margin: 0 0 var(--ds-space-4) 0;
}

.payment-failed-banner__icon {
  flex-shrink: 0;
  margin-top: 2px;
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.payment-failed-banner__icon svg {
  display: block;
  width: 24px;
  height: 24px;
  fill: var(--ds-status-warning-ink);
}

.payment-failed-banner__content {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  gap: var(--ds-space-3);
}

.payment-failed-banner__message {
  color: var(--ds-status-warning-ink);
  font-size: 1rem;
  line-height: 1.5;
}

.payment-failed-banner__actions {
  margin-top: var(--ds-space-3);
}

.payment-failed-banner__button {
  background: var(--ds-brand-primary);
  color: var(--ds-ink-on-accent);
  border: none;
  border-radius: var(--ds-radius-md);
  padding: 0 var(--ds-space-4);
  height: 36px;
  font-size: 1rem;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s;
  box-shadow: none;
  outline: none;
}

.payment-failed-banner__button:hover,
.payment-failed-banner__button:focus {
  background: var(--ds-brand-primary-hover);
}
</style>
<div class="payment-failed-banner">
  <span class="payment-failed-banner__icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
      <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
      <rect x="11" y="6" width="2" height="7" rx="1" fill="currentColor"/>
      <rect x="11" y="15" width="2" height="2" rx="1" fill="currentColor"/>
    </svg>
  </span>
  <div class="payment-failed-banner__content">
    <div class="payment-failed-banner__message">
      Card ending 4821 was declined. Payroll disbursement halts at 17:00 UTC unless you replace your payment method.
    </div>
    <div class="payment-failed-banner__actions">
      <button class="payment-failed-banner__button" type="button">Replace card</button>
    </div>
  </div>
</div>
