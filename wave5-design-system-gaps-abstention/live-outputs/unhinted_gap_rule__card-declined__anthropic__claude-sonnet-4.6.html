<style>
  .payment-alert {
    display: flex;
    align-items: flex-start;
    gap: var(--ds-space-3);
    background-color: var(--ds-status-warning-bg);
    border: 1.5px solid var(--ds-border-strong);
    border-radius: var(--ds-radius-md);
    padding: var(--ds-space-4);
    box-sizing: border-box;
    max-width: 640px;
  }

  .payment-alert__icon-wrap {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    margin-top: 1px;
  }

  .payment-alert__icon-wrap svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  .payment-alert__body {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: var(--ds-space-3);
  }

  .payment-alert__heading {
    margin: 0;
    font-family: inherit;
    font-size: 0.9375rem;
    font-weight: 700;
    line-height: 1.4;
    color: var(--ds-status-warning-ink);
  }

  .payment-alert__message {
    margin: 0;
    font-family: inherit;
    font-size: 0.875rem;
    line-height: 1.5;
    color: var(--ds-ink-primary);
  }

  .payment-alert__message strong {
    font-weight: 600;
    color: var(--ds-status-warning-ink);
  }

  .payment-alert__action {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px var(--ds-space-4);
    background-color: var(--ds-brand-primary);
    color: var(--ds-ink-on-accent);
    border: none;
    border-radius: var(--ds-radius-md);
    font-family: inherit;
    font-size: 0.875rem;
    font-weight: 600;
    line-height: 1;
    cursor: pointer;
    text-decoration: none;
    transition: background-color 0.15s ease;
  }

  .payment-alert__action:hover,
  .payment-alert__action:focus-visible {
    background-color: var(--ds-brand-primary-hover);
    outline: 2px solid var(--ds-brand-primary);
    outline-offset: 2px;
  }

  .payment-alert__severity-bar {
    flex-shrink: 0;
    width: 4px;
    align-self: stretch;
    border-radius: 4px;
    background-color: var(--ds-border-strong);
  }

  .payment-alert__severity-bar[data-ds-gap="status-critical-accent"] {
    background-color: var(--ds-border-strong);
  }
</style>

<div class="payment-alert" role="alert" aria-live="assertive" aria-atomic="true">
  <div
    class="payment-alert__severity-bar"
    data-ds-gap="status-critical-accent"
    aria-hidden="true"
  ></div>

  <div class="payment-alert__icon-wrap" aria-hidden="true">
    <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path
        d="M10 2L2 17h16L10 2z"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linejoin="round"
        style="color: var(--ds-status-warning-ink);"
      />
      <line
        x1="10" y1="8" x2="10" y2="12"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        style="color: var(--ds-status-warning-ink);"
      />
      <circle
        cx="10" cy="14.5" r="0.75"
        fill="currentColor"
        style="color: var(--ds-status-warning-ink);"
      />
    </svg>
  </div>

  <div class="payment-alert__body">
    <p class="payment-alert__heading">Payment Failed — Action Required</p>
    <p class="payment-alert__message">
      <strong>Card ending 4821 was declined.</strong>
      Payroll disbursement halts at <strong>17:00 UTC</strong> unless you
      replace your payment method.
    </p>
    <a
      href="#replace-card"
      class="payment-alert__action"
      aria-label="Replace card to resume payroll disbursement"
    >
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="3" width="12" height="8" rx="1.5" stroke="currentColor" stroke-width="1.25"/>
        <line x1="1" y1="6" x2="13" y2="6" stroke="currentColor" stroke-width="1.25"/>
      </svg>
      Replace card
    </a>
  </div>
</div>
