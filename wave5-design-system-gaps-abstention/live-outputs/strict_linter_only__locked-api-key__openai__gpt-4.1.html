<style>
.api-key-row {
  display: flex;
  align-items: center;
  background: var(--ds-surface-card);
  border: 1px solid var(--ds-border-subtle);
  border-radius: var(--ds-radius-md);
  padding: var(--ds-space-4);
  gap: var(--ds-space-4);
}

.api-key-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.api-key-label {
  color: var(--ds-ink-secondary);
  font-size: 14px;
  margin-bottom: 2px;
}

.api-key-value {
  color: var(--ds-ink-primary);
  font-size: 16px;
  font-family: monospace;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.api-key-actions {
  display: flex;
  align-items: center;
  gap: var(--ds-space-3);
}

.rotate-key-btn {
  background: var(--ds-surface-sunken);
  color: var(--ds-ink-secondary);
  border: 1px solid var(--ds-border-subtle);
  border-radius: var(--ds-radius-md);
  padding: 0 var(--ds-space-4);
  height: 36px;
  font-size: 15px;
  cursor: not-allowed;
  opacity: 0.6;
  pointer-events: none;
  transition: none;
  font-weight: 500;
}

.rotate-key-btn:focus {
  outline: none;
}

.rotate-key-btn[disabled] {
  /* Ensures disabled appearance */
  background: var(--ds-surface-sunken);
  color: var(--ds-ink-secondary);
  border-color: var(--ds-border-subtle);
  cursor: not-allowed;
  opacity: 0.6;
}
</style>
<div class="api-key-row">
  <div class="api-key-info">
    <span class="api-key-label">API key</span>
    <span class="api-key-value">prod_live_98a1...f2</span>
  </div>
  <div class="api-key-actions">
    <button class="rotate-key-btn" type="button" disabled>Rotate key</button>
  </div>
</div>
