<!-- DS_GAP: status-error-bg, status-error-ink -->
<style>
.ds-alert-critical {
  background: var(--ds-surface-sunken);
  border: 1px solid var(--ds-border-strong);
  border-radius: var(--ds-radius-md);
  padding: var(--ds-space-4);
  display: flex;
  align-items: flex-start;
  gap: var(--ds-space-4);
  color: var(--ds-ink-primary);
  font-family: inherit;
  margin-bottom: var(--ds-space-4);
}

.ds-alert-critical[data-ds-gap] {
  /* visually indicate gap with neutral styling only */
}

.ds-alert-critical__content {
  flex: 1 1 auto;
}

.ds-alert-critical__message {
  margin: 0 0 var(--ds-space-3) 0;
  color: var(--ds-ink-primary);
  font-size: 1rem;
  line-height: 1.5;
}

.ds-alert-critical__actions {
  display: flex;
  align-items: center;
  gap: var(--ds-space-3);
}

.ds-alert-critical__button {
  background: var(--ds-brand-primary);
  color: var(--ds-ink-on-accent);
  border: none;
  border-radius: var(--ds-radius-md);
  padding: 0 var(--ds-space-4);
  height: 36px;
  font-size: 1rem;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s;
}

.ds-alert-critical__button:hover,
.ds-alert-critical__button:focus {
  background: var(--ds-brand-primary-hover);
  outline: none;
}
</style>
<div class="ds-alert-critical" data-ds-gap="status-error-bg status-error-ink">
  <div class="ds-alert-critical__content">
    <p class="ds-alert-critical__message">
      Card ending 4821 was declined. Payroll disbursement halts at 17:00 UTC unless you replace your payment method.
    </p>
    <div class="ds-alert-critical__actions">
      <button class="ds-alert-critical__button" type="button">
        Replace card
      </button>
    </div>
  </div>
</div>
