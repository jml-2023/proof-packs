<!-- DS_GAP: destructive-action -->
<style>
  .card {
    background-color: var(--ds-surface-card);
    border-radius: var(--ds-radius-md);
    border: 1px solid var(--ds-border-subtle);
    padding: var(--ds-space-4);
    max-width: 400px;
  }
  
  .title {
    color: var(--ds-ink-primary);
    font-weight: 600;
    margin: 0 0 var(--ds-space-3) 0;
  }
  
  .description {
    color: var(--ds-ink-secondary);
    margin: 0 0 var(--ds-space-4) 0;
    line-height: 1.4;
  }
  
  .button-group {
    display: flex;
    gap: var(--ds-space-3);
    justify-content: flex-end;
  }
  
  .button {
    padding: var(--ds-space-3) var(--ds-space-4);
    border-radius: var(--ds-radius-md);
    border: 1px solid var(--ds-border-strong);
    background-color: var(--ds-surface-sunken);
    color: var(--ds-ink-primary);
    cursor: pointer;
    font-weight: 500;
  }
  
  .button-delete {
    background-color: var(--ds-surface-sunken);
    border-color: var(--ds-border-strong);
    color: var(--ds-ink-primary);
    data-ds-gap: destructive-action;
  }
</style>

<div class="card">
  <h3 class="title">Delete workspace permanently?</h3>
  <p class="description">This will erase 14,200 customer records forever. This action cannot be undone.</p>
  <div class="button-group">
    <button class="button">Cancel</button>
    <button class="button button-delete" data-ds-gap="destructive-action">Delete forever</button>
  </div>
</div>
